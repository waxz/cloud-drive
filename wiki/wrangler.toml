name = "wiki"
main = "worker/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# The React app (built by Vite into dist/client). The Worker runs first for
# the API, sync, and the HTML entry points (so WIKI_PASSWORD covers the app);
# hashed JS/CSS/fonts are served directly.
[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/parties/*", "/", "/p/*"]

# One Durable Object per page holds the live Yjs document and its saved state.
[[durable_objects.bindings]]
name = "PageRoom"
class_name = "PageRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PageRoom"]

# Page tree and full-text search.
[[d1_databases]]
binding = "DB"
database_name = "wiki"
migrations_dir = "migrations"

# Deployed, reach cloud-drive through a service binding: a Worker can't call
# another Worker on the same account through its public workers.dev URL.
# [[services]]
# binding = "CLOUD_DRIVE"
# service = "cf-drive"

[vars]
# cloud-drive WebDAV endpoint and drive used for uploaded images and files.
# With the CLOUD_DRIVE binding, only the URL's path is used.
CLOUD_DRIVE_URL = "http://127.0.0.1:8792"
CLOUD_DRIVE_DRIVE = "drive"

# Secrets (wrangler secret put / .dev.vars):
#   CLOUD_DRIVE_USER, CLOUD_DRIVE_PASSWORD  cloud-drive user for uploads
#   WIKI_PASSWORD                           optional; when set, the whole wiki
#                                           asks for it (Basic auth, any username)
