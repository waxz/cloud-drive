name = "cf-drive"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[alias]
"@aws-sdk/xml-builder" = "./shims/xml-builder.js"
# Azure's browser build has no shared-key auth; use its Node build.
"@azure/storage-blob" = "./node_modules/@azure/storage-blob/dist/esm/index.js"
"@azure/storage-common" = "./node_modules/@azure/storage-common/dist/esm/index.js"
"@azure/core-xml" = "./node_modules/@azure/core-xml/dist/esm/index.js"

# Admin settings, users and usage counters.
[[kv_namespaces]]
binding = "CONFIG"

# Optional: an R2 bucket bound directly to the Worker. Shows up as the
# "r2-binding" backend type in the admin panel (no API keys needed).
[[r2_buckets]]
binding = "BUCKET"

# Secrets (set with `wrangler secret put`):
#   ADMIN_PASSWORD  password for the /admin panel
